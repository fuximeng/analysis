{% extends "base.html" %}
{% block title %}用户注册 - 电商数据分析系统{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5 col-lg-4">
            <div class="card shadow-sm border-0 rounded-4">
                <div class="card-body p-4">
                    <div class="text-center mb-4">
                        <div class="display-6 text-primary mb-2"><i class="bi bi-person-plus"></i></div>
                        <h4 class="fw-bold">注册新账号</h4>
                        <p class="text-muted small">加入电商数据分析可视化平台</p>
                    </div>

                    <div id="regAlert" class="alert alert-danger d-none py-2" role="alert"></div>

                    <form id="regForm">
                        <div class="mb-3">
                            <label class="form-label small fw-semibold">用户名</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-person"></i></span>
                                <input type="text" class="form-control" id="regUsername" required placeholder="3-50个字符" autofocus>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label small fw-semibold">密码</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-key"></i></span>
                                <input type="password" class="form-control" id="regPassword" required placeholder="至少6位">
                            </div>
                        </div>
                        <div class="mb-4">
                            <label class="form-label small fw-semibold">确认密码</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-check2-circle"></i></span>
                                <input type="password" class="form-control" id="regConfirmPassword" required placeholder="再次输入密码">
                            </div>
                        </div>
                        <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold" id="regSubmitBtn">
                            注 册
                        </button>
                    </form>

                    <div class="text-center mt-4 text-muted small">
                        已有账号？ <a href="/login" class="text-decoration-none">去登录</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
document.getElementById('regForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    const btn = document.getElementById('regSubmitBtn');
    const alertBox = document.getElementById('regAlert');
    alertBox.classList.add('d-none');

    const username = document.getElementById('regUsername').value.trim();
    const password = document.getElementById('regPassword').value.trim();
    const confirm_password = document.getElementById('regConfirmPassword').value.trim();

    if (password !== confirm_password) {
        alertBox.textContent = '两次输入的密码不一致';
        alertBox.classList.remove('d-none');
        return;
    }

    btn.disabled = true;
    btn.textContent = '注册中...';

    try {
        const resp = await fetch('/auth/register', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, password, confirm_password })
        });
        const res = await resp.json();
        if (res.code === 200) {
            alert('注册成功，请使用新账号登录');
            window.location.href = '/login';
        } else {
            alertBox.textContent = res.message || '注册失败';
            alertBox.classList.remove('d-none');
        }
    } catch (err) {
        alertBox.textContent = '网络请求异常，请稍后重试';
        alertBox.classList.remove('d-none');
    } finally {
        btn.disabled = false;
        btn.textContent = '注 册';
    }
});
</script>
{% endblock %}
