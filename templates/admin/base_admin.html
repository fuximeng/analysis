<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}管理后台 - 电商数据分析系统{% endblock %}</title>
    <!-- Bootstrap 5 & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
    <!-- ECharts 5 -->
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <style>
        .admin-sidebar {
            width: 240px;
            min-height: calc(100vh - 56px);
            background: #1e293b;
        }
        .admin-sidebar .nav-link {
            color: #94a3b8;
            padding: 0.75rem 1.25rem;
            display: flex;
            align-items: center;
            font-size: 0.95rem;
            border-radius: 6px;
            margin: 2px 8px;
        }
        .admin-sidebar .nav-link:hover {
            color: #f8fafc;
            background: #334155;
        }
        .admin-sidebar .nav-link.active {
            color: #ffffff;
            background: #3b82f6;
            font-weight: 600;
        }
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body class="bg-light d-flex flex-column min-vh-100">

    <!-- 顶部管理导航 -->
    <nav class="navbar navbar-expand navbar-dark bg-dark sticky-top shadow-sm px-3">
        <a class="navbar-brand fw-bold d-flex align-items-center" href="/admin">
            <i class="bi bi-shield-lock-fill text-warning me-2"></i>
            <span>电商分析管理后台</span>
        </a>
        <div class="ms-auto d-flex align-items-center gap-3">
            <a href="/" class="btn btn-outline-light btn-sm"><i class="bi bi-box-arrow-up-right me-1"></i>前台首页</a>
            <span class="text-white-50 small"><i class="bi bi-person-fill me-1"></i>{{ session.get('username', '管理员') }}</span>
            <a href="javascript:void(0);" onclick="logoutUser()" class="btn btn-danger btn-sm py-0 px-2"><i class="bi bi-power"></i></a>
        </div>
    </nav>

    <!-- 主工作区：左侧边栏 + 右主区 -->
    <div class="d-flex flex-grow-1">
        <!-- 侧边栏菜单 -->
        <aside class="admin-sidebar p-2 flex-shrink-0">
            <ul class="nav nav-pills flex-column">
                <li class="nav-item">
                    <a class="nav-link {% if request.path == '/admin' or request.path == '/admin/' %}active{% endif %}" href="/admin">
                        <i class="bi bi-speedometer2 me-2"></i>控制台概览
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link {% if '/admin/crawler' in request.path %}active{% endif %}" href="/admin/crawler">
                        <i class="bi bi-robot me-2"></i>数据采集管理
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link {% if '/admin/data' in request.path %}active{% endif %}" href="/admin/data">
                        <i class="bi bi-database-check me-2"></i>清洗与质量管理
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link {% if '/admin/analysis' in request.path %}active{% endif %}" href="/admin/analysis">
                        <i class="bi bi-pie-chart-fill me-2"></i>系统分析洞察
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link {% if '/admin/users' in request.path %}active{% endif %}" href="/admin/users">
                        <i class="bi bi-people-fill me-2"></i>用户权限管理
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link {% if '/admin/logs' in request.path %}active{% endif %}" href="/admin/logs">
                        <i class="bi bi-journal-text me-2"></i>运行与操作日志
                    </a>
                </li>
            </ul>
        </aside>

        <!-- 右侧主内容 -->
        <main class="flex-grow-1 p-4 overflow-auto">
            {% block content %}{% endblock %}
        </main>
    </div>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
