{% extends "admin/base_admin.html" %}
{% block title %}用户权限管理 - 电商分析系统{% endblock %}

{% block content %}
<div class="container-fluid">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h4 class="fw-bold mb-1">用户账号与权限管理</h4>
            <p class="text-muted small mb-0">查看所有注册用户，管理账号启用状态与权限角色</p>
        </div>
        <button class="btn btn-outline-primary btn-sm" onclick="loadUsers()"><i class="bi bi-arrow-clockwise me-1"></i>刷新列表</button>
    </div>

    <!-- 用户数据表 -->
    <div class="card border-0 shadow-sm rounded-3">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                        <tr>
                            <th class="ps-3">ID</th>
                            <th>用户名</th>
                            <th>系统角色</th>
                            <th>账号状态</th>
                            <th>注册时间</th>
                            <th class="text-center pe-3">状态控制</th>
                        </tr>
                    </thead>
                    <tbody id="userTableBody">
                        <tr><td colspan="6" class="text-center py-4 text-muted">加载中...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
async function loadUsers() {
    const tbody = document.getElementById('userTableBody');
    try {
        const res = await (await fetch('/admin/users')).json();
        if (res.code === 200 && res.data) {
            const users = res.data;
            tbody.innerHTML = users.map(u => `
                <tr>
                    <td class="ps-3 text-muted small">${u.id}</td>
                    <td><span class="fw-semibold">${u.username}</span></td>
                    <td><span class="badge ${u.role === 'admin' ? 'bg-warning text-dark' : 'bg-secondary'}">${u.role}</span></td>
                    <td><span class="badge ${u.status === 1 ? 'bg-success' : 'bg-danger'}">${u.status === 1 ? '正常' : '已禁用'}</span></td>
                    <td class="small text-muted">${u.created_at || '-'}</td>
                    <td class="text-center pe-3">
                        <button class="btn btn-sm ${u.status === 1 ? 'btn-outline-danger' : 'btn-outline-success'} py-0 px-2" onclick="toggleUserStatus(${u.id}, ${u.status === 1 ? 0 : 1})">
                            ${u.status === 1 ? '禁用' : '启用'}
                        </button>
                    </td>
                </tr>
            `).join('');
        }
    } catch (e) {
        tbody.innerHTML = '<tr><td colspan="6" class="text-center py-4 text-danger">加载失败</td></tr>';
    }
}

async function toggleUserStatus(userId, newStatus) {
    if (!confirm(`确定要${newStatus === 1 ? '启用' : '禁用'}该用户吗？`)) return;
    try {
        const res = await (await fetch(`/admin/users/${userId}/status`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ status: newStatus })
        })).json();
        if (res.code === 200) {
            loadUsers();
        } else {
            alert(res.message || '更新状态失败');
        }
    } catch (e) {
        alert('请求异常');
    }
}

document.addEventListener('DOMContentLoaded', loadUsers);
</script>
{% endblock %}
