{% extends "admin/base_admin.html" %}
{% block title %}数据采集管理 - 电商分析系统{% endblock %}

{% block content %}
<div class="container-fluid">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h4 class="fw-bold mb-1">数据采集与爬虫管理</h4>
            <p class="text-muted small mb-0">管理外部数据源采集任务，支持在线执行与任务跟踪</p>
        </div>
        <button class="btn btn-primary btn-sm" id="btnRunCrawl" onclick="triggerCrawlTask()">
            <i class="bi bi-play-circle-fill me-1"></i>立即执行采集
        </button>
    </div>

    <!-- 运行状态提示 -->
    <div id="crawlStatusAlert" class="alert alert-info d-none py-2 mb-3"></div>

    <!-- 采集任务表格 -->
    <div class="card border-0 shadow-sm rounded-3">
        <div class="card-header bg-white py-3 border-0">
            <h6 class="fw-bold mb-0"><i class="bi bi-list-task text-primary me-2"></i>历史采集任务队列</h6>
        </div>
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                        <tr>
                            <th class="ps-3">任务ID</th>
                            <th>任务名称</th>
                            <th>状态</th>
                            <th>总数</th>
                            <th>成功数</th>
                            <th>失败数</th>
                            <th>开始时间</th>
                            <th>完成时间</th>
                        </tr>
                    </thead>
                    <tbody id="taskTableBody">
                        <tr><td colspan="8" class="text-center py-4 text-muted">加载中...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
async function loadTasks() {
    const tbody = document.getElementById('taskTableBody');
    try {
        const res = await (await fetch('/crawler/tasks')).json();
        if (res.code === 200 && res.data) {
            const list = res.data;
            if (list.length === 0) {
                tbody.innerHTML = '<tr><td colspan="8" class="text-center py-4 text-muted">暂无采集任务记录，点击上方按钮触发采集</td></tr>';
                return;
            }
            tbody.innerHTML = list.map(t => `
                <tr>
                    <td class="ps-3 fw-bold small">${t.id}</td>
                    <td><span class="fw-semibold">${t.task_name}</span></td>
                    <td><span class="badge ${t.status === 'success' ? 'bg-success' : (t.status === 'running' ? 'bg-primary' : 'bg-secondary')}">${t.status}</span></td>
                    <td>${t.total_count}</td>
                    <td><span class="text-success fw-semibold">${t.success_count}</span></td>
                    <td><span class="text-danger fw-semibold">${t.fail_count}</span></td>
                    <td class="small text-muted">${t.started_at || '-'}</td>
                    <td class="small text-muted">${t.finished_at || '-'}</td>
                </tr>
            `).join('');
        }
    } catch (e) {
        tbody.innerHTML = '<tr><td colspan="8" class="text-center py-4 text-danger">加载失败</td></tr>';
    }
}

async function triggerCrawlTask() {
    const btn = document.getElementById('btnRunCrawl');
    const alertBox = document.getElementById('crawlStatusAlert');
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span>采集中...';
    alertBox.classList.remove('d-none');
    alertBox.textContent = '正在连接 DummyJSON 数据源采集商品数据，请稍候...';

    try {
        const res = await (await fetch('/crawler/run', { method: 'POST' })).json();
        if (res.code === 200) {
            alertBox.className = 'alert alert-success py-2 mb-3';
            alertBox.textContent = `采集成功！共获取 ${res.data ? res.data.count : 0} 条最新商品数据。`;
            loadTasks();
        } else {
            alertBox.className = 'alert alert-danger py-2 mb-3';
            alertBox.textContent = res.message || '采集失败';
        }
    } catch (e) {
        alertBox.className = 'alert alert-danger py-2 mb-3';
        alertBox.textContent = '采集请求异常，请检查网络与后端日志';
    } finally {
        btn.disabled = false;
        btn.innerHTML = '<i class="bi bi-play-circle-fill me-1"></i>立即执行采集';
    }
}

document.addEventListener('DOMContentLoaded', loadTasks);
</script>
{% endblock %}
