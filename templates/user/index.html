{% extends "base.html" %}
{% block title %}首页 - 电商数据分析系统{% endblock %}

{% block content %}
<div class="container-fluid px-4">
    <!-- 欢迎与页面标题 -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h4 class="fw-bold mb-1">电商数据概览看板</h4>
            <p class="text-muted small mb-0">实时汇聚电商商品采集与多维度指标分析结果</p>
        </div>
        <div>
            <a href="/user/products" class="btn btn-outline-primary btn-sm me-2"><i class="bi bi-grid me-1"></i>商品列表</a>
            <a href="/user/analysis" class="btn btn-primary btn-sm"><i class="bi bi-bar-chart-fill me-1"></i>深度分析</a>
        </div>
    </div>

    <!-- 顶部 KPI 指标卡片 -->
    <div class="row g-3 mb-4" id="kpiContainer">
        <div class="col-6 col-md-3">
            <div class="card kpi-card p-3 bg-white">
                <div class="d-flex justify-content-between align-items-center">
                    <div>
                        <div class="text-muted small">商品总数</div>
                        <h3 class="fw-bold text-primary my-1" id="kpiProductCount">-</h3>
                        <span class="badge bg-primary-subtle text-primary small">总收录数</span>
                    </div>
                    <div class="fs-1 text-primary-emphasis opacity-25"><i class="bi bi-box-seam"></i></div>
                </div>
            </div>
        </div>
        <div class="col-6 col-md-3">
            <div class="card kpi-card p-3 bg-white">
                <div class="d-flex justify-content-between align-items-center">
                    <div>
                        <div class="text-muted small">商品分类数</div>
                        <h3 class="fw-bold text-success my-1" id="kpiCategoryCount">-</h3>
                        <span class="badge bg-success-subtle text-success small">类目覆盖</span>
                    </div>
                    <div class="fs-1 text-success opacity-25"><i class="bi bi-tags"></i></div>
                </div>
            </div>
        </div>
        <div class="col-6 col-md-3">
            <div class="card kpi-card p-3 bg-white">
                <div class="d-flex justify-content-between align-items-center">
                    <div>
                        <div class="text-muted small">商品均价</div>
                        <h3 class="fw-bold text-warning my-1" id="kpiAvgPrice">-</h3>
                        <span class="badge bg-warning-subtle text-warning small" id="kpiPriceRange">区间: -</span>
                    </div>
                    <div class="fs-1 text-warning opacity-25"><i class="bi bi-currency-dollar"></i></div>
                </div>
            </div>
        </div>
        <div class="col-6 col-md-3">
            <div class="card kpi-card p-3 bg-white">
                <div class="d-flex justify-content-between align-items-center">
                    <div>
                        <div class="text-muted small">平均评分</div>
                        <h3 class="fw-bold text-info my-1" id="kpiAvgRating">-</h3>
                        <span class="badge bg-info-subtle text-info small" id="kpiTotalStock">总库存: -</span>
                    </div>
                    <div class="fs-1 text-info opacity-25"><i class="bi bi-star-fill"></i></div>
                </div>
            </div>
        </div>
    </div>

    <!-- ECharts 图表第 1 行：分类柱状图 + 分类饼图 -->
    <div class="row g-3 mb-4">
        <div class="col-lg-7">
            <div class="card chart-card p-3">
                <h6 class="fw-bold mb-3 d-flex align-items-center">
                    <i class="bi bi-bar-chart me-2 text-primary"></i>分类商品数量分布
                </h6>
                <div id="chartCategoryBar" class="chart-container"></div>
            </div>
        </div>
        <div class="col-lg-5">
            <div class="card chart-card p-3">
                <h6 class="fw-bold mb-3 d-flex align-items-center">
                    <i class="bi bi-pie-chart me-2 text-success"></i>商品分类占比
                </h6>
                <div id="chartCategoryPie" class="chart-container"></div>
            </div>
        </div>
    </div>

    <!-- ECharts 图表第 2 行：价格区间直方图 + 评分区间直方图 -->
    <div class="row g-3">
        <div class="col-lg-6">
            <div class="card chart-card p-3">
                <h6 class="fw-bold mb-3 d-flex align-items-center">
                    <i class="bi bi-graph-up me-2 text-warning"></i>商品价格区间分布
                </h6>
                <div id="chartPriceDist" class="chart-container"></div>
            </div>
        </div>
        <div class="col-lg-6">
            <div class="card chart-card p-3">
                <h6 class="fw-bold mb-3 d-flex align-items-center">
                    <i class="bi bi-stars me-2 text-info"></i>商品评分区间分布
                </h6>
                <div id="chartRatingDist" class="chart-container"></div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
document.addEventListener('DOMContentLoaded', async function() {
    // 1. 加载 Overview KPI
    try {
        const res = await (await fetch('/analysis/overview')).json();
        if (res.code === 200 && res.data) {
            const d = res.data;
            document.getElementById('kpiProductCount').textContent = d.product_count ?? 0;
            document.getElementById('kpiCategoryCount').textContent = d.category_count ?? 0;
            document.getElementById('kpiAvgPrice').textContent = '$' + (d.average_price ?? 0).toFixed(2);
            document.getElementById('kpiAvgRating').textContent = (d.average_rating ?? 0).toFixed(2) + ' 分';
            document.getElementById('kpiPriceRange').textContent = `最高 $${d.max_price ?? 0} / 最低 $${d.min_price ?? 0}`;
            document.getElementById('kpiTotalStock').textContent = `总库存: ${d.total_stock ?? 0}`;
        }
    } catch (e) {
        console.error('Failed to load overview:', e);
    }

    // 2. 加载分类分析图表 (Bar & Pie)
    const barDom = document.getElementById('chartCategoryBar');
    const pieDom = document.getElementById('chartCategoryPie');
    const barChart = barDom ? echarts.init(barDom) : null;
    const pieChart = pieDom ? echarts.init(pieDom) : null;
    if (barChart) barChart.showLoading({ text: '数据加载中...' });
    if (pieChart) pieChart.showLoading({ text: '数据加载中...' });

    try {
        const res = await (await fetch('/analysis/category')).json();
        if (barChart) barChart.hideLoading();
        if (pieChart) pieChart.hideLoading();

        if (res.code === 200 && Array.isArray(res.data) && res.data.length > 0) {
            const cats = res.data.map(c => ({
                category: c.category || '未知',
                product_count: Number(c.product_count !== undefined ? c.product_count : (c.count !== undefined ? c.count : 0))
            }));

            // 排序后取 Top 15，避免标签重叠
            cats.sort((a, b) => b.product_count - a.product_count);
            const topCats = cats.slice(0, 15);

            const catNames = topCats.map(c => c.category);
            const catCounts = topCats.map(c => c.product_count);

            // 分类柱状图
            if (barChart) {
                barChart.setOption({
                    tooltip: { trigger: 'axis', axisPointer: { type: 'shadow' } },
                    grid: { left: '3%', right: '4%', bottom: '18%', containLabel: true },
                    xAxis: {
                        type: 'category',
                        data: catNames,
                        axisLabel: { rotate: 30, interval: 0, fontSize: 11 }
                    },
                    yAxis: { type: 'value', name: '商品数量' },
                    series: [{
                        name: '商品数',
                        type: 'bar',
                        data: catCounts,
                        itemStyle: { color: '#3b82f6', borderRadius: [4, 4, 0, 0] }
                    }]
                });
                window.addEventListener('resize', () => barChart.resize());
            }

            // 分类饼图 (Top 8 + 其它)
            if (pieChart) {
                const pieData = topCats.slice(0, 8).map(c => ({ name: c.category, value: c.product_count }));
                const otherSum = topCats.slice(8).reduce((acc, cur) => acc + cur.product_count, 0);
                if (otherSum > 0) pieData.push({ name: '其他', value: otherSum });

                pieChart.setOption({
                    tooltip: { trigger: 'item', formatter: '{b}: {c} ({d}%)' },
                    legend: { orient: 'vertical', left: 'left', textStyle: { fontSize: 11 } },
                    series: [{
                        name: '分类占比',
                        type: 'pie',
                        radius: ['40%', '70%'],
                        center: ['60%', '50%'],
                        avoidLabelOverlap: false,
                        itemStyle: { borderRadius: 6, borderColor: '#fff', borderWidth: 2 },
                        label: { show: false },
                        data: pieData
                    }]
                });
                window.addEventListener('resize', () => pieChart.resize());
            }
        }
    } catch (e) {
        if (barChart) barChart.hideLoading();
        if (pieChart) pieChart.hideLoading();
        console.error('Failed to load category chart:', e);
    }

    // 3. 价格区间直方图
    const priceDom = document.getElementById('chartPriceDist');
    const priceChart = priceDom ? echarts.init(priceDom) : null;
    if (priceChart) priceChart.showLoading({ text: '数据加载中...' });

    try {
        const res = await (await fetch('/analysis/price')).json();
        if (priceChart) priceChart.hideLoading();
        if (res.code === 200 && res.data && Array.isArray(res.data.distribution)) {
            const dist = res.data.distribution;
            const bins = dist.map(d => d.range || d.bin || '其他');
            const counts = dist.map(d => Number(d.count) || 0);

            if (priceChart) {
                priceChart.setOption({
                    tooltip: { trigger: 'axis', axisPointer: { type: 'shadow' } },
                    grid: { left: '3%', right: '4%', bottom: '12%', containLabel: true },
                    xAxis: { type: 'category', data: bins, name: '价格区间($)' },
                    yAxis: { type: 'value', name: '商品数' },
                    series: [{
                        name: '商品数量',
                        type: 'bar',
                        data: counts,
                        itemStyle: { color: '#f59e0b', borderRadius: [4, 4, 0, 0] }
                    }]
                });
                window.addEventListener('resize', () => priceChart.resize());
            }
        }
    } catch (e) {
        if (priceChart) priceChart.hideLoading();
        console.error('Failed to load price chart:', e);
    }

    // 4. 评分区间直方图
    const ratingDom = document.getElementById('chartRatingDist');
    const ratingChart = ratingDom ? echarts.init(ratingDom) : null;
    if (ratingChart) ratingChart.showLoading({ text: '数据加载中...' });

    try {
        const res = await (await fetch('/analysis/rating')).json();
        if (ratingChart) ratingChart.hideLoading();
        if (res.code === 200 && res.data && Array.isArray(res.data.distribution)) {
            const dist = res.data.distribution;
            const bins = dist.map(d => d.range || d.bin || '其他');
            const counts = dist.map(d => Number(d.count) || 0);

            if (ratingChart) {
                ratingChart.setOption({
                    tooltip: { trigger: 'axis', axisPointer: { type: 'shadow' } },
                    grid: { left: '3%', right: '4%', bottom: '12%', containLabel: true },
                    xAxis: { type: 'category', data: bins, name: '评分区间' },
                    yAxis: { type: 'value', name: '商品数' },
                    series: [{
                        name: '商品数量',
                        type: 'bar',
                        data: counts,
                        itemStyle: { color: '#06b6d4', borderRadius: [4, 4, 0, 0] }
                    }]
                });
                window.addEventListener('resize', () => ratingChart.resize());
            }
        }
    } catch (e) {
        if (ratingChart) ratingChart.hideLoading();
        console.error('Failed to load rating chart:', e);
    }
});
</script>
{% endblock %}
